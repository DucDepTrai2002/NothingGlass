name: Build glass.dex

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Compile and dex
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PLAT="$SDK/platforms/android-35"
          BT="$SDK/build-tools/35.0.0"
          [ -f "$PLAT/android.jar" ] || { echo "::error::missing $PLAT/android.jar"; ls "$SDK" "$SDK/platforms" || true; exit 1; }
          echo "platform: $PLAT"
          echo "build-tools: $BT"
          mkdir -p out/classes out/dex
          if ! javac --release 11 -nowarn \
            -cp "$PLAT/android.jar" \
            -d out/classes $(find src -name '*.java') 2> javac.log; then
            echo "::error::javac: $(head -c 1500 javac.log | tr '\n' ' ')"; exit 1
          fi
          if ! "$BT/d8" --release --min-api 33 --lib "$PLAT/android.jar" \
            --output out/dex $(find out/classes -name '*.class') 2> d8.log; then
            echo "::error::d8: $(head -c 1500 d8.log | tr '\n' ' ')"; exit 1
          fi
          cp out/dex/classes.dex glass.dex
          ls -la glass.dex

      - uses: actions/upload-artifact@v4
        with:
          name: glass-dex
          path: glass.dex

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: glass.dex build ${{ github.run_number }}
          files: glass.dex
          make_latest: true
