name: Build glass.dex

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and dex
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PLAT=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "platform: $PLAT"
          echo "build-tools: $BT"
          mkdir -p out/classes out/dex
          javac -source 11 -target 11 -nowarn \
            -bootclasspath "$PLAT/android.jar" -cp "$PLAT/android.jar" \
            -d out/classes $(find src -name '*.java')
          "$BT/d8" --release --min-api 33 --lib "$PLAT/android.jar" \
            --output out/dex $(find out/classes -name '*.class')
          cp out/dex/classes.dex glass.dex
          ls -la glass.dex

      - uses: actions/upload-artifact@v4
        with:
          name: glass-dex
          path: glass.dex

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: glass.dex build ${{ github.run_number }}
          files: glass.dex
          make_latest: true
